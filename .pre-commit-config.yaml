repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
        - id: trailing-whitespace
        - id: end-of-file-fixer
        - id: check-yaml
        - id: check-added-large-files
          args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
        - id: ruff-check
          args: ["--fix"]
        - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (type check)
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: False

  - repo: local
    hooks:
      - id: block-medical-data
        name: block medical images and arrays
        entry: "Medical images / arrays must never be committed. Keep them on Kaggle."
        language: fail
        files: '\.(dcm|dicom|nii|nii\.gz|npy|npz|jpe?g|png)$'
        exclude: '^docs/assets/'
